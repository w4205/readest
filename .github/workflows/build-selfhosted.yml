# Self-hosted Windows build — no local toolchain needed.
#
# This is a trimmed copy of the Windows x64 leg of upstream
# .github/workflows/nightly.yml (matrix entry `--target x86_64-pc-windows-msvc
# --bundles nsis`) with everything that needs readest's own secrets removed:
#   * TAURI_SIGNING_PRIVATE_KEY / updater .sig step (replaced by a fork-local
#     keypair generated per run, see below)
#   * rclone -> Cloudflare R2 upload of artifacts + manifest fragment
#   * Sentry source-map upload (scripts/upload-sourcemaps.mjs already no-ops
#     when SENTRY_AUTH_TOKEN is absent, and it is not set here)
# and one thing added: artifacts go to the workflow run via upload-artifact.
#
# The build carries the fork's paywall patch: apps/readest-app/src/utils/
# access.ts isSelfHosted() is forced true, which makes isCustomizationAllowed()
# (access.ts:187) true for every user, signed in or not. The
# NEXT_PUBLIC_SELF_HOSTED env route does NOT work here — verified on run
# 39784615883: Next does not rewrite the bracket form
# `process.env['NEXT_PUBLIC_SELF_HOSTED']`, so it survived into the client
# bundle as a runtime lookup that yields undefined in the webview.
# See targets/readest/补丁记录.md for the full gate inventory.
name: Build self-hosted

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'rebuild even when upstream version is unchanged'
        type: boolean
        default: false
  # Daily try: if upstream released a new version, rebase the patch onto it,
  # push main (without needing a local machine) and build all legs here.
  schedule:
    - cron: '30 3 * * *'
  push:
    paths:
      - '.github/workflows/build-selfhosted.yml'
      - 'apps/readest-app/src/utils/access.ts'

permissions:
  # the sync job rewrites main when upstream ships a new version
  contents: write

jobs:
  # Decides whether anything has to be built.
  #   push              -> always build the pushed commit (normal path)
  #   dispatch/schedule -> only build when upstream's apps/readest-app version
  #                        differs from ours (or force=true). When it does:
  #                        reset onto upstream/main, re-apply the one-line
  #                        paywall patch, force-push main, then the legs below
  #                        build that exact commit.
  sync:
    name: sync upstream (version gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push event - building $(git rev-parse --short HEAD)"
            {
              echo "rebuild=true"
              echo "sha=$(git rev-parse HEAD)"
              echo "version=$(jq -r .version apps/readest-app/package.json)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'readest-selfhosted-bot'
          git config user.email 'selfhosted-bot@users.noreply.github.com'

          # keep this file across the reset below
          cp .github/workflows/build-selfhosted.yml "$RUNNER_TEMP/wf.yml"

          git remote add upstream https://github.com/readest/readest.git
          git fetch --depth 20 upstream main
          UP=$(git rev-parse upstream/main)
          OUR_VERSION=$(jq -r .version apps/readest-app/package.json)
          UP_VERSION=$(git show "$UP:apps/readest-app/package.json" | jq -r .version)
          echo "ours=$OUR_VERSION upstream=$UP_VERSION upstream_main=$UP force=${{ inputs.force }}"

          if [ "$UP_VERSION" = "$OUR_VERSION" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::upstream is still $UP_VERSION - nothing to build (pass force=true to rebuild anyway)"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "== resetting onto upstream $UP_VERSION ($UP) =="
          git checkout -B main "$UP"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/wf.yml" .github/workflows/build-selfhosted.yml

          # The whole patch: force isSelfHosted() true. Emits the marker the
          # build legs grep for. Keep in sync with 补丁记录.md §4.
          python3 - <<'PY'
          import sys
          path = 'apps/readest-app/src/utils/access.ts'
          src = open(path, encoding='utf-8').read()
          anchor = 'export const isSelfHosted = (): boolean =>'
          injected = ('  (globalThis as { __READEST_SELFHOSTED_PATCH__?: boolean })'
                      '.__READEST_SELFHOSTED_PATCH__ !== false ||')
          if '__READEST_SELFHOSTED_PATCH__' in src:
              print('already patched - leaving as is')
          elif anchor in src:
              head, rest = src.split(anchor, 1)
              open(path, 'w', encoding='utf-8').write(head + anchor + '\n' + injected + rest)
              print('patch applied after:', anchor)
          else:
              sys.exit('::error::isSelfHosted() anchor not found in access.ts - '
                       'upstream restructured the paywall. Re-read 补丁记录.md §1 and pick a new anchor.')
          PY

          git add -A
          git commit -m "selfhosted: upstream $UP_VERSION ($UP) + paywall patch"
          git push --force origin HEAD:main

          {
            echo "rebuild=true"
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$UP_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::rebased onto upstream $UP_VERSION, building $(git rev-parse --short HEAD)"

  win-x64:
    name: windows x64 (nsis)
    needs: sync
    if: needs.sync.outputs.rebuild == 'true'
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      # packages/tauri (the readest tauri fork), packages/foliate-js,
      # packages/simplecc-wasm and the src-tauri plugins all live here.
      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: selfhosted-win-x64-cargo

      # Fail fast, before the ~25-40 minute Rust compile. The whole point of this
      # build is the paywall patch, so prove it reached the client bundle: the
      # patched isSelfHosted() reads a global whose property name survives
      # minification, so the marker must be present in out/_next/static/chunks.
      - name: build frontend and verify the paywall patch landed
        shell: bash
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm build-tauri
          chunks=out/_next/static/chunks
          echo "== chunks: $(ls "$chunks" | wc -l) files =="
          if ! grep -rlq '__READEST_SELFHOSTED_PATCH__' "$chunks"; then
            echo "::error::paywall patch marker missing from the bundle — access.ts was not the source that got compiled"
            exit 1
          fi
          echo "== patch marker present in: =="
          grep -rl '__READEST_SELFHOSTED_PATCH__' "$chunks"
          echo "== patched predicate as compiled (should compare a global to false) =="
          grep -rho '.\{0,60\}__READEST_SELFHOSTED_PATCH__.\{0,80\}' "$chunks" | sort -u | head -4

      # tauri.conf.json has bundle.createUpdaterArtifacts:true plus a pubkey but
      # no private key here, so the bundler aborts with "A public key has been
      # found, but no private key" (run 39785376972, after the Rust compile).
      # Generate a fork-local minisign keypair and override
      # plugins.updater.pubkey with it. Side effect worth knowing: the updater
      # still points at readest.com, but official installers no longer verify
      # against our pubkey, so an auto-update cannot silently replace this
      # patched build.
      - name: generate fork-local updater signing key
        shell: bash
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm tauri signer generate -w "$RUNNER_TEMP/readest.key" -p "" --ci --force
          pub=$(cat "$RUNNER_TEMP/readest.key.pub")
          printf '{"plugins":{"updater":{"pubkey":"%s"}}}' "$pub" > "$RUNNER_TEMP/pubkey.json"
          echo "== pubkey override =="
          cat "$RUNNER_TEMP/pubkey.json"

      - name: build desktop bundle
        shell: bash
        timeout-minutes: 85
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/readest.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "$RUNNER_TEMP/pubkey.json"
          cd ../..
          echo "== bundles =="
          ls -l target/x86_64-pc-windows-msvc/release/bundle/nsis/ || true
          ls -l target/x86_64-pc-windows-msvc/release/readest.exe || true

      - name: upload installer and portable exe
        uses: actions/upload-artifact@v4
        with:
          name: readest-selfhosted-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/readest.exe

  # Android arm64 leg — the counterpart of .github/workflows/release.yml's
  # android matrix entry (`-t aarch64`, NDK 28.2.13676358, keystore.properties
  # inside gen/android), with rclone/R2/Sentry/release-upload stripped out and
  # the artifact going to the workflow run instead.
  #
  # Signing: the fork's own keystore from the ANDROID_KEY_* repository secrets
  # (see targets/readest/keystore/). Stable across runs, but it is NOT the
  # Readest release key, so:
  #   * installing over an official APK requires uninstalling it first
  #     (INSTALL_FAILED_UPDATE_INCOMPATIBLE);
  #   * readest.com updates cannot replace it.
  # Both also hold for the Windows build, for the same reason.
  #
  # Legs mirror upstream release.yml's android matrix: `arm64` = -t aarch64,
  # `legacy` = -t armv7 -t i686 -t x86_64 (old 32-bit phones + x86 emulators).
  # Each leg still produces ONE universal-flavour APK; "universal" there is a
  # Gradle flavour name, not an ABI set, so a leg's APK only carries the ABIs
  # it was built for.
  android:
    name: android ${{ matrix.leg }} (apk)
    needs: sync
    if: needs.sync.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: arm64
            rust_targets: aarch64-linux-android
            build_targets: '-t aarch64'
          - leg: legacy
            rust_targets: armv7-linux-androideabi i686-linux-android x86_64-linux-android
            build_targets: '-t armv7 -t i686 -t x86_64'
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'

      - name: install NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: selfhosted-android-${{ matrix.leg }}-cargo

      # Same fail-fast as the Windows leg: prove the paywall patch reached the
      # client bundle before spending ~40 minutes on the Rust build.
      - name: build frontend and verify the paywall patch landed
        shell: bash
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm build
          chunks=out/_next/static/chunks
          echo "== chunks: $(ls "$chunks" | wc -l) files =="
          if ! grep -rlq '__READEST_SELFHOSTED_PATCH__' "$chunks"; then
            echo "::error::paywall patch marker missing from the bundle — access.ts was not the source that got compiled"
            exit 1
          fi
          echo "== patch marker present in: =="
          grep -rl '__READEST_SELFHOSTED_PATCH__' "$chunks"

      # bundle.createUpdaterArtifacts is true with a pubkey baked in, and the
      # bundler aborts when no private key is available. Same workaround as the
      # Windows leg.
      - name: generate fork-local updater signing key
        shell: bash
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm tauri signer generate -w "$RUNNER_TEMP/readest.key" -p "" --ci --force
          pub=$(cat "$RUNNER_TEMP/readest.key.pub")
          printf '{"plugins":{"updater":{"pubkey":"%s"}}}' "$pub" > "$RUNNER_TEMP/pubkey.json"

      - name: tauri android init
        shell: bash
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          # readest ships a CUSTOMISED gen/android (flavor dimensions
          # store/pen, missingDimensionStrategy, Sentry manifest placeholder,
          # 15 tracked files). `tauri android init` regenerates the plain
          # template, which makes Gradle fail with "Could not resolve project
          # :tauri-plugin-native-bridge ... selects variant:
          # 'fossBooxPenRelease' / 'fossGenericPenRelease'" for the universal
          # variant. Restoring the tracked files puts the customisations back
          # while leaving the untracked generated ones (tauri.properties,
          # tauri.settings.gradle, jniLibs symlinks) in place — same step
          # upstream release.yml runs right after `android init`.
          git checkout -- .

      - name: write signing config
        shell: bash
        run: |
          set -euo pipefail
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          {
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
          } > apps/readest-app/src-tauri/gen/android/keystore.properties

      - name: build apk
        shell: bash
        timeout-minutes: 90
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/readest.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm tauri android build ${{ matrix.build_targets }} --config "$RUNNER_TEMP/pubkey.json"
          version=$(jq -r .version package.json)
          mkdir -p ../../dist-android
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk              "../../dist-android/Readest_${version}_${{ matrix.leg }}_selfhosted.apk"

      - name: verify signature and record hashes
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls dist-android/*.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "== apksigner: $apksigner =="
          "$apksigner" verify --print-certs "$apk"
          ls -l "$apk"
          sha256sum "$apk"

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: readest-selfhosted-android-${{ matrix.leg }}
          if-no-files-found: error
          retention-days: 14
          path: dist-android/*.apk

  # Publishes the built files as a GitHub Release on the fork, so they survive
  # the 14-day artifact expiry and can be downloaded later without hunting
  # through old runs. Tag format: selfhosted-v<version>. Re-running for the same
  # version replaces the assets (--clobber) instead of creating a new release.
  #
  # NOTE: the fork is a public repo, so its Releases are publicly downloadable.
  release:
    name: publish release
    needs: [sync, win-x64, android]
    if: needs.sync.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.sync.outputs.version }}
          COMMIT: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          tag="selfhosted-v${VERSION}"
          mkdir -p rel
          find dist -type f \( -name '*.apk' -o -name '*.exe' \) -exec cp -v {} rel/ \;
          [ -n "$(ls -A rel)" ] || { echo '::error::no build outputs to release'; exit 1; }
          ( cd rel && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt )

          notes=$(mktemp)
          {
            echo "Self-hosted unlock build of Readest ${VERSION} (paywall patch: \`isSelfHosted()\` forced true)."
            echo
            echo "- upstream commit: \`${COMMIT}\`"
            echo "- built by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- patch and evidence: \`targets/readest/补丁记录.md\` in the workspace repo"
            echo
            echo '| file | what |'
            echo '|---|---|'
            echo "| \`Readest_${VERSION}_x64-setup.exe\` | Windows x64 NSIS installer (also portable \`readest.exe\` asset) |"
            echo "| \`Readest_${VERSION}_arm64_selfhosted.apk\` | Android arm64 (modern phones) |"
            echo "| \`Readest_${VERSION}_legacy_selfhosted.apk\` | Android armeabi-v7a + x86 + x86_64 (old phones / emulators) |"
            echo
            echo "Signing: self-built Android keystore (NOT the official Readest key) — uninstall an official"
            echo "APK first; this build cannot be updated by the Play Store or by readest.com. Upgrades keep"
            echo "app data because the keystore is stable across these builds."
            echo
            echo 'Verify downloads with `SHA256SUMS.txt`.'
          } > "$notes"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag exists — replacing assets"
            gh release upload "$tag" rel/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" rel/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" \
              --title "Readest ${VERSION} · self-hosted unlock" \
              --notes-file "$notes"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name) \(.size) bytes")'
